apiVersion: v1
kind: Secret
metadata:
  name: e2e-encryption-secret
  namespace: kube-system
stringData:
  encryption-passphrase: e2e-passphrase
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hcloud-volumes-encrypted
provisioner: csi.hetzner.cloud
parameters:
  csi.storage.k8s.io/node-publish-secret-name: e2e-encryption-secret
  csi.storage.k8s.io/node-publish-secret-namespace: kube-system
